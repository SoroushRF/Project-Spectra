name: spectra_mobile
description: Real-Time Local-First Adaptive Emotion Intelligence for Mobile.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  camera: ^0.11.0
  tflite_flutter: ^0.12.1
  google_mlkit_face_detection: ^0.11.0
  image: ^4.1.3
  path_provider: ^2.1.1
  path: ^1.8.3
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0+1
  
  provider: ^6.1.1
  camera_macos: ^0.0.9
  camera_avfoundation: ^0.9.22+8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/spectra_model.tflite
